[build]
  command = ""
  publish = "publish_output/wwwroot"

# MIME types correctos para Blazor WebAssembly
[[headers]]
  for = "/_framework/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"

[[headers]]
  for = "/_framework/*.wasm.br"
  [headers.values]
    Content-Type = "application/wasm"
    Content-Encoding = "br"

[[headers]]
  for = "/_framework/*.wasm.gz"
  [headers.values]
    Content-Type = "application/wasm"
    Content-Encoding = "gzip"

[[headers]]
  for = "/_framework/*.js"
  [headers.values]
    Content-Type = "application/javascript"

[[headers]]
  for = "/_framework/*.js.br"
  [headers.values]
    Content-Type = "application/javascript"
    Content-Encoding = "br"

[[headers]]
  for = "/_framework/*.js.gz"
  [headers.values]
    Content-Type = "application/javascript"
    Content-Encoding = "gzip"

[[headers]]
  for = "/_framework/*.dat"
  [headers.values]
    Content-Type = "application/octet-stream"

[[headers]]
  for = "/_framework/*.dat.br"
  [headers.values]
    Content-Type = "application/octet-stream"
    Content-Encoding = "br"

[[headers]]
  for = "/_framework/*.dat.gz"
  [headers.values]
    Content-Type = "application/octet-stream"
    Content-Encoding = "gzip"

# SPA fallback para Blazor routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
