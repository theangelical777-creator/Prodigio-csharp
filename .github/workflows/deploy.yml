name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      - name: Publish Blazor WebAssembly
        run: dotnet publish -c Release -o output

      - name: Fix base href for GitHub Pages
        run: |
          python - <<'PY'
          from pathlib import Path
          framework = Path('output/wwwroot/_framework')
          aliases = {
              'blazor.webassembly.js': 'blazor.webassembly.*.js',
              'dotnet.js': 'dotnet.*.js',
              'dotnet.runtime.js': 'dotnet.runtime.*.js',
              'dotnet.native.js': 'dotnet.native.*.js',
          }
          for alias, pattern in aliases.items():
              target = framework / alias
              if not target.exists():
                  matches = sorted(framework.glob(pattern))
                  if matches:
                      target.write_bytes(matches[0].read_bytes())

          for rel in [Path('output/wwwroot/index.html'), Path('output/wwwroot/404.html')]:
              if rel.exists():
                  text = rel.read_text(encoding='utf-8')
                  text = text.replace('<base href="/" />', '<base href="./" />')
                  text = text.replace('<base href="/Prodigio-csharp/" />', '<base href="./" />')
                  rel.write_text(text, encoding='utf-8')
          Path('output/wwwroot/.nojekyll').write_text('', encoding='utf-8')
          Path('output/wwwroot/_redirects').write_text('/* /index.html 200\n', encoding='utf-8')
          if not Path('output/wwwroot/404.html').exists():
              Path('output/wwwroot/404.html').write_text(Path('output/wwwroot/index.html').read_text(encoding='utf-8'), encoding='utf-8')
          PY

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: output/wwwroot
          branch: gh-pages
          clean: true
